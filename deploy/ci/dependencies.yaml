# Throw-away PostgreSQL, S3 (moto) and Hub stand-in for the cluster smoke test
# (deploy/ci/kind-test.sh). Not a deployment example: no persistence, no TLS.
apiVersion: v1
kind: Secret
metadata:
  name: hfproxy
stringData:
  database_url: postgres://postgres:postgres@postgres:5432/hfproxy?sslmode=disable
  session_secret: ci-session-secret-0123456789abcdef0123456789
  s3_access_key: test
  s3_secret_key: test
  setup_token: ci-setup-token-0123456789abcdef
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_PASSWORD, value: postgres}
            - {name: POSTGRES_DB, value: hfproxy}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres", "-d", "hfproxy"]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moto
spec:
  replicas: 1
  selector:
    matchLabels: {app: moto}
  template:
    metadata:
      labels: {app: moto}
    spec:
      enableServiceLinks: false
      containers:
        - name: moto
          image: python:3.12-slim
          command: ["sh", "-c", "pip install --quiet --no-cache-dir 'moto[server]' && exec moto_server -H 0.0.0.0 -p 5000"]
          ports: [{containerPort: 5000}]
          readinessProbe:
            httpGet: {path: /moto-api/, port: 5000}
            periodSeconds: 3
            failureThreshold: 60
---
apiVersion: v1
kind: Service
metadata:
  name: moto
spec:
  selector: {app: moto}
  ports: [{port: 5000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakehub
spec:
  replicas: 1
  selector:
    matchLabels: {app: fakehub}
  template:
    metadata:
      labels: {app: fakehub}
    spec:
      enableServiceLinks: false
      containers:
        - name: fakehub
          image: python:3.12-slim
          command: ["python", "/app/fakehub.py"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /_hits, port: 8080}
            periodSeconds: 2
          volumeMounts:
            - {name: script, mountPath: /app}
      volumes:
        - name: script
          configMap: {name: fakehub-script}
---
apiVersion: v1
kind: Service
metadata:
  name: fakehub
spec:
  selector: {app: fakehub}
  ports: [{port: 8080}]
