apiVersion: v1
kind: Service
metadata:
  name: {{ include "hfproxy.fullname" . }}
  labels: {{- include "hfproxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "hfproxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
{{- if .Values.metrics.enabled }}
---
# Metrics stay off the public Service and the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hfproxy.fullname" . }}-metrics
  labels: {{- include "hfproxy.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  selector: {{- include "hfproxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
