{{- if .Values.migrations.job.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "hfproxy.fullname" . }}-migrate
  labels: {{- include "hfproxy.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {{- include "hfproxy.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "hfproxy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate", "up"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "hfproxy.env" . | nindent 12 }}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets/hfproxy, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "hfproxy.secretVolume" . | nindent 8 }}
        - name: tmp
          emptyDir: {}
{{- end }}
