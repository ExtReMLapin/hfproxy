apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hfproxy.fullname" . }}
  labels: {{- include "hfproxy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "hfproxy.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels: {{- include "hfproxy.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson (merge (dict) .Values.config .Values.extraConfig .Values.secrets.files) | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "hfproxy.fullname" . }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: hfproxy
          image: {{ include "hfproxy.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "hfproxy.env" . | nindent 12 }}
            - name: HFPROXY_AUTO_MIGRATE
              value: {{ .Values.migrations.auto | quote }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: secrets, mountPath: /run/secrets/hfproxy, readOnly: true}
            - {name: staging, mountPath: /staging}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "hfproxy.secretVolume" . | nindent 8 }}
        - name: staging
          {{- if eq .Values.staging.type "pvc" }}
          persistentVolumeClaim:
            claimName: {{ include "hfproxy.fullname" . }}-staging
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.staging.sizeLimit }}
          {{- end }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
