version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Wait a few days before proposing a brand new release (security updates
    # are not delayed): a compromised release is usually pulled within days.
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      go-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
      semver-major-days: 14
    groups:
      # Angular packages must move together.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*"]
      ui-dependencies:
        patterns: ["*"]
    ignore:
      # Angular's compiler declares the TypeScript range it supports (currently
      # >=6.0 <6.1); a newer TypeScript breaks the build. Remove this when the
      # installed Angular accepts it. See docs/dependencies.md.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
