name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      HFPROXY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Vet
        run: go vet ./...
      - name: Start S3 test server
        run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.2.5"
          "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 5055 > "$RUNNER_TEMP/moto.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:5055/moto-api/; then break; fi
            sleep 1
          done
          curl -sS -f -X PUT http://127.0.0.1:5055/hfproxy
      - name: Start a directory server (OpenLDAP)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq slapd ldap-utils >/dev/null
          sudo systemctl stop slapd || true
          # The environment the directory tests read (host, CA bundle).
          deploy/ci/ldap-up.sh "$RUNNER_TEMP/ldap" | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Test
        env:
          HFPROXY_TEST_S3_ENDPOINT: http://127.0.0.1:5055
          HFPROXY_TEST_S3_ACCESS_KEY: test
          HFPROXY_TEST_S3_SECRET_KEY: test
          HFPROXY_TEST_S3_REGION: us-east-1
          HFPROXY_TEST_S3_BUCKET: hfproxy
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        run: |
          go test -race -count=1 -v -coverprofile=coverage.out -coverpkg=./... ./... | tee test.log
          # The load test is opt-in (nightly workflow); every other skip means a
          # dependency of the integration tests is missing.
          if grep -- '--- SKIP' test.log | grep -qvE 'TestLoadParallelDownloads|TestOIDCKeycloak'; then
            echo "Integration tests were skipped; PostgreSQL and S3 must both be available."
            grep -- '--- SKIP' test.log | grep -vE 'TestLoadParallelDownloads|TestOIDCKeycloak'
            exit 1
          fi
      - name: Coverage threshold
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "Total statement coverage: ${total}%"
          # Measured at 65% when the threshold was last raised; raise it as coverage grows.
          awk -v t="$total" 'BEGIN { exit (t >= 60.0) ? 0 : 1 }' || { echo "Coverage ${total}% is below the 60% minimum."; exit 1; }
      - name: Build
        run: go build -trimpath ./cmd/hfproxy
      - name: The build is reproducible
        run: |
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/a" ./cmd/hfproxy
          go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/b" ./cmd/hfproxy
          cmp "$RUNNER_TEMP/a" "$RUNNER_TEMP/b"
  oidc:
    # Signs in through a real Keycloak (the "build" job covers the mocked IdP).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      HFPROXY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Start Keycloak
        run: deploy/ci/keycloak-up.sh | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Sign in through Keycloak
        run: |
          go test -race -count=1 -v -run 'TestOIDCKeycloak' ./internal/server | tee oidc.log
          if grep -q -- '--- SKIP' oidc.log; then echo "The Keycloak tests were skipped."; exit 1; fi
      - name: Keycloak log
        if: failure()
        run: docker logs hfproxy-keycloak 2>&1 | tail -80
  reproducible-image:
    # The image is built twice from scratch (no cache) and the two must be the
    # same image, digest for digest. Base images are pinned by digest and
    # timestamps are rewritten to the commit date.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build twice and compare
        run: |
          epoch="$(git log -1 --format=%ct)"
          for run in a b; do
            docker buildx build --no-cache --platform linux/amd64 --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH="$epoch" --build-arg BUILD_VERSION=ci --build-arg BUILD_COMMIT="$GITHUB_SHA" \
              --output "type=oci,dest=$RUNNER_TEMP/$run.tar,rewrite-timestamp=true" .
            mkdir "$RUNNER_TEMP/$run"
            tar -xf "$RUNNER_TEMP/$run.tar" -C "$RUNNER_TEMP/$run"
          done
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, sys
          root = sys.argv[1]
          def load(run):
              blobs = f"{root}/{run}/blobs/sha256/"
              index = json.load(open(f"{root}/{run}/index.json"))
              manifest = index["manifests"][0]["digest"].split(":")[1]
              m = json.load(open(blobs + manifest))
              return manifest, m["config"]["digest"], [l["digest"] for l in m["layers"]]
          a, b = load("a"), load("b")
          print("image a:", a[0]); print("image b:", b[0])
          if a == b:
              print("The two builds are identical."); sys.exit(0)
          print("The builds differ.")
          print("config:", a[1] == b[1] and "same" or "different")
          for i, (x, y) in enumerate(zip(a[2], b[2])):
              print(f"layer {i}:", "same" if x == y else f"different ({x} / {y})")
          sys.exit(1)
          PY
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Scan dependencies and standard library for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...
  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      # Reviewed exclusions (see docs/security-scanning.md): every other rule,
      # including hard-coded credentials, weak crypto and file permissions,
      # stays enabled and blocks the build.
      - name: Security scan
        run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.30.0
          -severity medium -confidence medium -exclude-generated
          -exclude=G115,G118,G124,G202,G304,G404,G701,G703,G704,G705
          ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image (not published)
        run: docker build --tag hfproxy:ci .
      - name: Smoke-test the image
        run: |
          set -eu
          docker run --rm hfproxy:ci version
          # Runs as UID 65532 and ships no shell.
          test "$(docker inspect --format '{{.Config.User}}' hfproxy:ci)" = "65532:65532"
          if docker run --rm --entrypoint /bin/sh hfproxy:ci -c true 2>/dev/null; then echo "the image must not contain a shell"; exit 1; fi
          # The binary starts, reads its configuration and refuses a bad one.
          docker run --rm \
            -e HFPROXY_DATABASE_URL=postgres://u:p@db:5432/app -e HFPROXY_SESSION_SECRET=0123456789abcdef0123456789abcdef \
            -e HFPROXY_S3_BUCKET=b -e HFPROXY_S3_REGION=r hfproxy:ci config validate
          if docker run --rm -e HFPROXY_SESSION_SECRET=short hfproxy:ci config validate 2>/dev/null; then echo "a short session secret must be refused"; exit 1; fi
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: hfproxy:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: The release notes can be extracted from the changelog
        run: scripts/release-notes.sh Unreleased > /dev/null
      - name: The chart's alert rules match the documented ones
        run: diff docs/prometheus-alerts.yml deploy/helm/hfproxy/files/prometheus-alerts.yml
      - name: Lint and render the chart
        run: |
          set -eu
          helm() { go run helm.sh/helm/v3/cmd/helm@v3.17.3 "$@"; }
          values="--set secrets.existingSecret=hfproxy --set config.PUBLIC_URL=https://hub.example.com --set config.S3_ENDPOINT=https://s3.example.com --set config.S3_REGION=r --set config.S3_BUCKET=b"
          helm lint deploy/helm/hfproxy $values
          helm template hfproxy deploy/helm/hfproxy $values --set ingress.enabled=true --set ingress.host=hub.example.com --set ingress.tlsSecretName=tls --set replicaCount=2 --set metrics.serviceMonitor.enabled=true --set metrics.prometheusRule.enabled=true --set staging.type=pvc > /dev/null
          if helm template hfproxy deploy/helm/hfproxy > /dev/null 2>&1; then echo "the chart must refuse to render without secrets.existingSecret"; exit 1; fi
  cluster:
    # Installs the chart in a real (kind) cluster and exercises the service there.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Build the image
        run: docker build --tag hfproxy:ci .
      - name: Install kind and helm
        run: |
          go install sigs.k8s.io/kind@v0.27.0
          go install helm.sh/helm/v3/cmd/helm@v3.17.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Chart smoke test in a kind cluster
        run: deploy/ci/kind-test.sh
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Translations are complete and up to date
        run: |
          npm run i18n:extract
          npx prettier --write src/locale/messages.json
          git diff --exit-code -- src/locale/messages.json
          npm run i18n:check
      - name: Test
        run: npm test -- --watch=false
      - name: Build
        run: npm run build
