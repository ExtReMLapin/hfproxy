name: hfproxy-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hfproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hfproxy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-hfproxy}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hfproxy_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password_change_me}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing local/hfproxy &&
        mc anonymous set none local/hfproxy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hfproxy_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_dev_password_change_me}
    restart: "no"

  hfproxy:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HFPROXY_LISTEN_ADDR: 0.0.0.0:8080
      HFPROXY_PUBLIC_URL: ${HFPROXY_PUBLIC_URL:-http://localhost:8080}
      HFPROXY_LOG_LEVEL: info
      HFPROXY_DATABASE_URL: postgres://${POSTGRES_USER:-hfproxy}:${POSTGRES_PASSWORD:-hfproxy_dev_password}@postgres:5432/${POSTGRES_DB:-hfproxy}?sslmode=disable
      HFPROXY_AUTO_MIGRATE: "true"
      HFPROXY_HF_BASE_URL: https://huggingface.co
      HFPROXY_HF_TOKEN_FILE: ${HFPROXY_HF_TOKEN_FILE:-/run/secrets/hf_token}
      HFPROXY_S3_ENDPOINT: http://minio:9000
      HFPROXY_S3_REGION: us-east-1
      HFPROXY_S3_BUCKET: hfproxy
      HFPROXY_S3_PREFIX: hfproxy
      HFPROXY_S3_FORCE_PATH_STYLE: "true"
      HFPROXY_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-hfproxy_dev}
      HFPROXY_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio_dev_password_change_me}
      HFPROXY_AUTH_MODE: local
      HFPROXY_ANONYMOUS_PUBLIC_READ: ${HFPROXY_ANONYMOUS_PUBLIC_READ:-true}
      HFPROXY_SESSION_SECRET: ${HFPROXY_SESSION_SECRET:-dev-only-session-secret-change-before-deployment-32-bytes}
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
