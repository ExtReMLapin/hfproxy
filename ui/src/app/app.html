@if (auth.loading()) {
  <main class="grid min-h-screen place-items-center bg-[#f5f7f9] px-6">
    <div class="flex items-center gap-3 text-sm font-medium text-slate-500">
      <span class="h-2.5 w-2.5 animate-pulse rounded-full bg-emerald-500"></span>
      Connecting to hfproxy
    </div>
  </main>
} @else if (auth.principal()) {
  <router-outlet />
} @else {
  <app-login-page />
}
